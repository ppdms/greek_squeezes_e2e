[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trogs26"
version = "0.1.0"
description = "Reading Greek squeezes with page networks: letter detection, reading, decoding and ROVER"
requires-python = "==3.11.*"
dependencies = [
    "numpy==2.4.6",
    "scipy==1.17.1",
    "torch==2.15.0",
    "rapidfuzz==3.14.6",
    # rotated-box intersection (trogs26.geometry)
    "opencv-python-headless==5.0.0.93",
    # imported by the official scorers (trogs26/third_party)
    "textdistance==4.6.3",
    "matplotlib==3.11.2",
    # the page network's image encoder (trogs26.pagenet.model, which reading and decoding import) and its
    # pretrained weights (trogs26.dino.pretrained); the pins of the GPU and decode environments
    "transformers==4.56.2",
    "safetensors==0.6.2",
    "huggingface_hub==0.36.2",
]

[project.optional-dependencies]
dev = ["pytest"]
# paper/make_figures.py, which also needs TeX Live (README)
paper = ["scikit-learn==1.9.1", "pillow==13.0.0"]

[tool.setuptools.packages.find]
include = ["trogs26*"]

[tool.setuptools.package-data]
"trogs26.third_party" = ["*.md"]
